name: server-ci
on:
  push:
    paths: ['server/**', 'shared/**', '.github/workflows/server-ci.yml']
  pull_request:
    paths: ['server/**', 'shared/**', '.github/workflows/server-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --workspaces=false
      - run: npm run lint
      - run: npm test -- --coverage
