name: client-ci
on:
  push:
    paths: ['client/**', 'server/**', 'shared/**', 'package-lock.json', '.github/workflows/client-ci.yml']
  pull_request:
    paths: ['client/**', 'server/**', 'shared/**', 'package-lock.json', '.github/workflows/client-ci.yml']
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=client
      - run: npm run typecheck --workspace=client
      - run: npm test --workspace=client
      - run: npm run build --workspace=client
  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: client
      # Boots a seeded mock-mode API + Vite (see client/playwright.config.ts); no external keys needed.
      - run: npm run test:e2e
        working-directory: client
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
