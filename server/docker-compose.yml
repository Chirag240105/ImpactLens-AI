services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ["impactlens-mongo:/data/db"]
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports: ["5000:5000"]
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/impactlens
      JWT_SECRET: local-compose-change-me
      AI_PROVIDER: mock
      CLIENT_URL: http://localhost:3000
    depends_on: [mongo]
volumes:
  impactlens-mongo:
